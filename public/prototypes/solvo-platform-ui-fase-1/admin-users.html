<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users - Solvo Platform</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Dual-assignment column helpers */
    .col-assignment { text-align: center; min-width: 80px; }
    .col-assignment-header { font-size: 0.72rem; line-height: 1.2; text-align: center; }
    .col-assignment-header small { display: block; font-weight: 400; color: var(--text-muted); }
    .count-zero { color: var(--text-muted); }
    /* Barra de filtros activos: solo aparece cuando hay algo que quitar */
    #filterBar:empty { display: none; }
    /* Nombre y correo en una línea: en pantallas angostas la tabla se desplaza */
    #usersTableBody td:nth-child(-n+2) { white-space: nowrap; }
  </style>
  <script src="theme.js"></script>
</head>
<body>
  <!-- Mobile Header -->
  <header class="mobile-header">
    <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="mobile-logo">
      <div class="logo-icon">S</div>
      <span class="logo-text">Solvo Platform</span>
    </div>
  </header>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="app-container">
    <!-- Sidebar (rendered by RBAC) -->
    <div id="sidebar-container"></div>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Header -->
      <header class="header">
        <h1 class="header-title">Solvo Sales Platform</h1>
      </header>

      <!-- Page Content -->
      <div class="page-content">
        <!-- Breadcrumb -->

        <!-- Page Header -->
        <div class="page-header">
          <div class="page-header-left">
            <h2 class="page-header-title">Users</h2>
            <p class="page-header-subtitle" style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Users and roles are managed in Microsoft Entra ID</p>
          </div>
        </div>

        <!-- Búsqueda y filtro de rol: la misma barra que Open Positions y Companies.
             Ambos aplican al instante; no hay botón de buscar. -->
        <div class="op-searchrow">
          <div class="op-searchshell">
            <div class="op-searchfield">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
              </svg>
              <input type="text" id="filterSearch" placeholder="Name or email" aria-label="Search users by name or email" autocomplete="off" oninput="filterUsers()">
            </div>
          </div>
          <div class="op-quickfilters">
            <div id="pickRole"></div>
          </div>
        </div>

        <div class="op-filterbar" id="filterBar"></div>

        <!-- Table -->
        <div class="table-container">
          <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Last login</th>
                <th class="col-assignment-header">Companies<small>Sales Rep</small></th>
                <th class="col-assignment-header">Companies<small>SDR</small></th>
                <th class="col-assignment-header">Vacancies<small>Sales Rep</small></th>
                <th class="col-assignment-header">Vacancies<small>SDR</small></th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
          </div>

          <div class="table-pagination">
            <div class="pagination-info" id="usersPaginationInfo">Showing 0 of 0</div>
            <div class="pagination-controls">
              <button class="pagination-btn" disabled>Previous</button>
              <button class="pagination-btn active">1</button>
              <button class="pagination-btn" disabled>Next</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="rbac.js"></script>
  <script>
    /* ------------------------------------------------------------------------
       Users — administración (solo Administrador). Sin cambios en Release 3.
       Datos: TEAM_MEMBERS (public.solvo_staff) + conteos de asignación por slot
       (staff_company_assignment / staff_vacancy_assignment) + last_login_at
       (MOCK_LAST_LOGIN, relativo a hoy). Solo lectura: altas,
       bajas y roles viven en Microsoft Entra ID. Contrato: GET /api/admin/users.
       ------------------------------------------------------------------------ */
    // === Session & Access Guard ===
    const user = initSession();
    if (!user) throw new Error('No session');
    if (!requireAdmin()) throw new Error('Access denied');
    renderSidebar('admin-users');

    // === Último login (solvo_staff.last_login_at) ===
    // Relativo a hoy, como el resto de la siembra: con fechas fijas la columna envejecía y
    // terminaba mostrando a todo el equipo sin entrar hace meses.
    const MOCK_LAST_LOGIN = (function () {
      const hoursAgo = { 'uuid-staff-001': 3, 'uuid-staff-002': 5, 'uuid-staff-003': 27, 'uuid-staff-004': 2,
        'uuid-staff-005': 49, 'uuid-staff-006': 4, 'uuid-staff-007': 30, 'uuid-staff-008': 8,
        'uuid-staff-009': 26, 'uuid-staff-010': 96, 'uuid-staff-011': 6 };
      const out = {};
      Object.keys(hoursAgo).forEach(function (id) {
        out[id] = formatStamp(new Date(Date.now() - hoursAgo[id] * 3600000));
      });
      return out;
    })();

    // === Render Users Table ===
    function renderUsersTable(data) {
      const members = data || TEAM_MEMBERS;
      const tbody = document.getElementById('usersTableBody');
      document.getElementById('usersPaginationInfo').textContent =
        `Showing ${members.length ? '1-' + members.length : '0'} of ${members.length}`;

      if (members.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; padding: 40px; color: var(--text-muted);">
              No users match these filters
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = members.map(member => {
        const roleData = ROLES[member.roleKey];
        const roleName = roleData ? roleData.name : member.roleKey;
        const lastLogin = MOCK_LAST_LOGIN[member.id] || '—';

        const fmtCount = (n) => n > 0
          ? `<strong>${n.toLocaleString()}</strong>`
          : `<span class="count-zero">0</span>`;

        return `
          <tr>
            <td class="font-medium">${member.name}</td>
            <td class="text-secondary">${member.email}</td>
            <td>
              <span class="op-cbadge user-role${member.roleKey === 'administrador' ? ' is-admin' : ''}">${roleName}</span>
            </td>
            <td class="text-secondary" style="white-space:nowrap;">${lastLogin}</td>
            <td class="col-assignment">${fmtCount(member.companiesAsComercial)}</td>
            <td class="col-assignment">${fmtCount(member.companiesAsSDR)}</td>
            <td class="col-assignment">${fmtCount(member.vacanciesAsComercial)}</td>
            <td class="col-assignment">${fmtCount(member.vacanciesAsSDR)}</td>
          </tr>`;
      }).join('');
    }

    // === Filtro de rol (selector de la barra, selección múltiple) ===
    const ROLE_KEYS = ['comercial', 'sdr', 'coordinador', 'supervisor', 'administrador'];
    let roleFilter = [];
    const rolePicker = renderShellPicker('pickRole', {
      icon: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>',
      allLabel: 'All roles',
      plural: 'roles',
      search: false,
      items: ROLE_KEYS.map(function (k) { return { value: k, label: ROLES[k] ? ROLES[k].name : k }; }),
      value: roleFilter,
      onChange: function (v) { roleFilter = v; filterUsers(); }
    });

    // Chips de lo que está filtrando, con su × y "Clear all", como en los listados.
    const ICON_CHIP_X = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>';
    function renderFilterBar(q) {
      const chips = [];
      if (q) chips.push({ key: '__q', text: '“' + q + '”' });
      roleFilter.forEach(function (k) { chips.push({ key: k, text: 'Role: ' + (ROLES[k] ? ROLES[k].name : k) }); });
      const bar = document.getElementById('filterBar');
      bar.innerHTML = chips.length
        ? chips.map(function (c) {
            return '<span class="op-chip"><span>' + escapeHtml(c.text) + '</span>' +
              '<button type="button" class="op-chip-x" aria-label="Remove filter" data-clear="' + c.key + '">' + ICON_CHIP_X + '</button></span>';
          }).join('') + '<button type="button" class="op-clearall" id="clearAllUsers">Clear all</button>'
        : '';
      bar.querySelectorAll('[data-clear]').forEach(function (b) {
        b.onclick = function () {
          if (b.dataset.clear === '__q') document.getElementById('filterSearch').value = '';
          else { roleFilter = roleFilter.filter(function (k) { return k !== b.dataset.clear; }); rolePicker.setValue(roleFilter); }
          filterUsers();
        };
      });
      const all = document.getElementById('clearAllUsers');
      if (all) all.onclick = function () {
        document.getElementById('filterSearch').value = '';
        roleFilter = []; rolePicker.setValue(roleFilter);
        filterUsers();
      };
    }

    function escapeHtml(t) {
      return String(t).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; });
    }

    // === Filter Users ===
    function filterUsers() {
      const rawSearch = document.getElementById('filterSearch').value.trim();
      const searchFilter = rawSearch.toLowerCase();
      renderFilterBar(rawSearch);

      const filtered = TEAM_MEMBERS.filter(member => {
        const matchesRole = !roleFilter.length || roleFilter.indexOf(member.roleKey) !== -1;
        const matchesSearch = !searchFilter ||
          member.name.toLowerCase().includes(searchFilter) ||
          member.email.toLowerCase().includes(searchFilter);

        return matchesRole && matchesSearch;
      });

      renderUsersTable(filtered);
    }

    // === Initial render ===
    renderUsersTable();
  </script>
</body>
</html>
