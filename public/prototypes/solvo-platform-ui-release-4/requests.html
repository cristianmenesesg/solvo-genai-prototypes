<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requests - Solvo Platform</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="r4-company.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="mobile-header">
    <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>
    <div class="mobile-logo">
      <div class="logo-icon">S</div>
      <span class="logo-text">Solvo Platform</span>
    </div>
  </header>

  <div class="sidebar-overlay" onclick="closeSidebar()"></div>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="header">
        <h1 class="header-title">Solvo Sales Platform</h1>
      </header>

      <div class="page-content">
        <h2 class="page-title">Requests</h2>
        <p class="rq-intro" id="rqIntro"></p>

        <div class="rq-toolbar">
          <div class="op-count" id="rqCount"></div>
          <select id="rqType" aria-label="Type of request">
            <option value="">All types</option>
            <option value="search">Search</option>
            <option value="research">Research</option>
          </select>
          <select id="rqStatus" aria-label="Status"></select>
          <select id="rqBy" aria-label="Requested by" hidden></select>
          <button type="button" class="op-actionbtn rq-btn-primary" onclick="openScrapePopup({ onSent: render })">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            Request search
          </button>
        </div>

        <div class="rq-list" id="rqList"></div>
      </div>
    </main>
  </div>

  <script src="rbac.js"></script>
  <script>
    /* ------------------------------------------------------------------------
       Requests — solicitudes a pedido de Release 4 (épica PEM).
       Datos: getVisibleRequests() sobre MOCK_REQUESTS (rbac.js 20.12): SDR y
       Sales Rep ven las suyas; Coordinator, Supervisor y Administrator ven todas,
       con la columna "Requested by" y su filtro. Cada solicitud es de uno de dos
       triggers: A pedido (`trg-on-demand`: siempre una empresa, con posiciones y
       ciudades como recorte opcional) o Investigación a pedido (`trg-research`).
       Secciones: barra con conteo, filtros (tipo, estado, quién la pidió) y las
       acciones; una fila por solicitud con tipo, objetivo, ventana, quién y
       cuándo, estado (REQUEST_STATUS) y avance; la fila se despliega con los
       pasos y los enlaces a lo que produjo (vacantes o la ficha de la empresa).
       Acciones: Request search → openScrapePopup. La investigación se pide sobre una
       empresa concreta, desde su ficha (Run research). `?id=req-…` abre esa fila.
       Contrato: la respuesta no llega por callback; el avance se lee del estado de
       las entidades que el trigger va actualizando. En la plataforma serían
       GET /api/requests (por usuario o todas) y GET /api/requests/:id.
       Prototipo: las solicitudes creadas desde los popups (`simulate: true`)
       avanzan con el tiempo transcurrido desde que se pidieron —en cola el primer
       minuto, en curso hasta el sexto, terminadas después— y sus resultados salen
       de las vacantes y empresas sembradas, así que no cambian entre recargas.
       ------------------------------------------------------------------------ */

    const ICON = {
      search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path></svg>',
      research: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path><path d="M11 8v6"></path><path d="M8 11h6"></path></svg>',
      caret: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>'
    };

    const filters = { type: '', status: '', by: '' };
    const open = new Set();

    function esc(s) {
      return String(s === null || s === undefined ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function when(iso) {
      const d = parseStamp(iso);
      return d.toLocaleDateString('en-US', { day: '2-digit', month: 'short' }) + ' · ' +
        d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }
    function ago(iso) {
      const m = Math.round((Date.now() - parseStamp(iso)) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return m + ' min ago';
      const h = Math.round(m / 60);
      if (h < 48) return h + ' h ago';
      return Math.round(h / 24) + ' days ago';
    }
    // A pedido es un solo modo: búsqueda de una empresa, con posiciones y ciudades opcionales.
    function kindOf(r) { return r.triggerId === 'trg-research' ? 'research' : 'search'; }
    const KIND_LABEL = { search: 'Search', research: 'Research' };
    function windowLabel(d) { return d ? (d === 1 ? 'Last day' : 'Last ' + d + ' days') : ''; }
    function companyOf(r) { return r.companyId ? MOCK_COMPANIES.find(function (c) { return c.id === r.companyId; }) : null; }
    function memberShort(id) { const m = getMemberById(id); return m ? m.shortName : 'Unknown user'; }
    function trigger(r) { return engineTrigger(r.triggerId) || { name: triggerName(r.triggerId), vacancyServices: {}, enrichment: [], decisionMakers: [], locations: [], activeTerms: [] }; }

    /* ---- Avance simulado de las solicitudes nuevas ---------------------------- */
    // Las vacantes que una búsqueda habría traído son las sembradas que cumplen sus
    // condiciones; así el enlace a los resultados lleva a registros reales del prototipo.
    function matchingVacancies(r) {
      const cutoff = Date.now() - (r.windowDays || 1) * 86400000 - 86400000;
      return MOCK_VACANCIES.filter(function (v) {
        if (parseStamp(v.detectedAtTs || v.detectedAt) < cutoff) return false;
        if (!r.companyId || v.companyId !== r.companyId) return false;
        if ((r.positionIds || []).length && r.positionIds.indexOf(v.positionId) < 0) return false;
        return !(r.cityIds || []).length || r.cityIds.indexOf(v.cityId) >= 0;
      });
    }

    function view(r) {
      if (!r.simulate || r.status === 'done' || r.status === 'failed' || r.status === 'no_results') return r;
      const m = (Date.now() - parseStamp(r.at)) / 60000;
      const v = Object.assign({}, r);
      if (r.triggerId === 'trg-research') {
        const c = companyOf(r);
        if (m < 1) { v.status = 'queued'; v.steps = {}; return v; }
        const essentials = c && c.sizeEmployees && c.industryCode && c.domain;
        const steps = {};
        if (m >= 2) steps.enrichment = essentials ? 'enriched' : (c && (c.isResearched || c.sizeEmployees) ? 'missing_data' : 'not_found');
        if (m >= 4 && steps.enrichment !== 'not_found') {
          steps.qualification = c && c.isExcluded ? 'excluded' : (steps.enrichment === 'enriched' || (c && c.icpScore != null) ? 'qualified' : 'pending');
        }
        if (m >= 6 && steps.qualification) steps.decisionMakers = steps.qualification === 'qualified' ? countDecisionMakers(c.id) : 0;
        v.steps = steps;
        if (steps.enrichment === 'not_found') { v.status = 'failed'; v.outcome = 'company_not_found'; }
        else v.status = m >= 6 ? 'done' : 'running';
        return v;
      }
      const toSearch = (r.progress && r.progress.toSearch) || 1;
      const found = matchingVacancies(r);
      if (m < 1) { v.status = 'queued'; return v; }
      const share = Math.min(1, (m - 1) / 5);
      const n = Math.round(found.length * share);
      v.progress = {
        searched: Math.min(toSearch, Math.ceil(toSearch * share)), toSearch: toSearch,
        found: n, analyzed: Math.max(0, n - (share < 1 ? 1 : 0)),
        viable: found.slice(0, Math.max(0, n - (share < 1 ? 1 : 0))).filter(function (x) { return x.remoteViable === true; }).length
      };
      v.vacancyIds = found.slice(0, n).map(function (x) { return x.id; });
      v.status = share < 1 ? 'running' : (found.length ? 'done' : 'no_results');
      return v;
    }

    /* ---- Celdas de la fila --------------------------------------------------- */
    function target(r) {
      const c = companyOf(r);
      const name = c ? c.name : (r.companyName || r.domain || 'Unnamed company');
      const sub = c ? [placeLabel(c, false), countryName(c.countryCode), c.domain].filter(Boolean).join(' · ')
        : [r.domain && r.companyName ? r.domain : '', r.country ? countryName(r.country) : ''].filter(Boolean).join(' · ') || 'Not in Solvo Platform';
      return { title: name, sub: sub };
    }

    // Recorte de una búsqueda: posiciones y ciudades como chips; vacío = todas / todo el país.
    function scopeChips(r) {
      const pos = (r.positionIds || []).map(getPositionName);
      const cities = (r.cityIds || []).map(cityName);
      return '<div class="rq-scope">' +
        (pos.length ? pos.map(function (x) { return '<span class="rq-chip">' + esc(x) + '</span>'; }).join('') : '<span class="rq-chip is-all">All positions</span>') +
        (cities.length ? cities.map(function (x) { return '<span class="rq-chip is-city">' + esc(x) + '</span>'; }).join('') : '<span class="rq-chip is-all is-city">Whole country</span>') +
      '</div>';
    }

    function stepChip(text, tone) { return '<span class="rq-step is-' + tone + '">' + esc(text) + '</span>'; }
    const ENRICH = { enriched: ['Enriched', 'success'], missing_data: ['Missing data', 'warning'], not_found: ['Not found', 'error'], running: ['In progress', 'info'] };
    const QUALIFY = { qualified: ['Qualified', 'success'], excluded: ['Excluded', 'error'], pending: ['Not qualified', 'warning'] };

    function researchSteps(v) {
      const s = v.steps || {};
      const arrow = '<span class="rq-steparrow" aria-hidden="true">&rarr;</span>';
      const e = ENRICH[s.enrichment], q = QUALIFY[s.qualification];
      const dm = s.decisionMakers;
      return '<div class="rq-steps">' +
        (e ? stepChip('Enrichment: ' + e[0], e[1]) : stepChip('Enrichment', 'pending')) + arrow +
        (q ? stepChip('Qualification: ' + q[0], q[1]) : stepChip('Qualification', 'pending')) + arrow +
        (dm !== undefined && dm !== null
          ? stepChip(dm + ' decision maker' + (dm === 1 ? '' : 's'), dm ? 'success' : 'neutral')
          : stepChip('Decision makers', 'pending')) +
      '</div>' +
      (v.outcome === 'company_not_found' ? '<div class="rq-outcome">Company not found.</div>' : '');
    }

    function searchProgress(v) {
      const p = v.progress || { searched: 0, toSearch: 0, found: 0, analyzed: 0, viable: 0 };
      if (v.status === 'queued') return '<div class="rq-counts">' + p.toSearch + ' search' + (p.toSearch === 1 ? '' : 'es') + ' pending</div>';
      const pct = p.toSearch ? Math.round(p.searched / p.toSearch * 100) : 0;
      return '<div class="rq-progress">' +
        '<div class="rq-bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + p.toSearch + '" aria-valuenow="' + p.searched + '" aria-label="Searches run"><span style="width:' + pct + '%"></span></div>' +
        '<div class="rq-counts"><strong>' + p.searched + '</strong>/' + p.toSearch + ' searches · <strong>' + p.found + '</strong> found · <strong>' + p.analyzed + '</strong> analyzed · <strong>' + p.viable + '</strong> viable</div>' +
        (v.status === 'no_results' ? '<div class="rq-counts">No openings found.</div>' : '') +
      '</div>';
    }

    function renderRow(r) {
      const v = view(r);
      const kind = kindOf(v);
      const t = target(v);
      const isOpen = open.has(v.id);
      const byCol = canViewAll()
        ? '<div class="rq-c rq-c-by"><span class="rq-key">Requested by</span><div class="rq-val">' + esc(memberShort(v.requestedBy)) + '</div>' +
          '<div class="rq-sub" title="' + esc(when(v.at)) + '">' + esc(ago(v.at)) + '</div></div>'
        : '<div class="rq-c rq-c-by"><span class="rq-key">Requested</span><div class="rq-val" title="' + esc(when(v.at)) + '">' + esc(ago(v.at)) + '</div></div>';

      return '<article class="rq-row' + (isOpen ? ' is-open' : '') + '" id="' + esc(v.id) + '">' +
        '<button type="button" class="rq-sum" aria-expanded="' + isOpen + '" aria-controls="' + esc(v.id) + '-detail" data-toggle="' + esc(v.id) + '">' +
          '<div class="rq-c-main">' +
            '<span class="rq-kind">' + ICON[kind] + esc(KIND_LABEL[kind]) + ' · ' + esc(trigger(v).name) + '</span>' +
            '<div class="rq-target">' + esc(t.title) + '</div>' +
            '<div class="rq-sub">' + esc(t.sub) + '</div>' +
            (kind === 'search' ? scopeChips(v) : '') +
          '</div>' +
          '<div class="rq-c rq-c-win"><span class="rq-key">Window</span><div class="rq-val">' +
            (kind === 'research' ? '<em>Not applicable</em>' : esc(windowLabel(v.windowDays))) + '</div></div>' +
          byCol +
          '<div class="rq-c rq-c-status"><div class="rq-status">' + stateBadge(REQUEST_STATUS, v.status) + '</div>' +
            (kind === 'research' ? researchSteps(v) : searchProgress(v)) + '</div>' +
          '<span class="rq-caret">' + ICON.caret + '</span>' +
        '</button>' +
        (isOpen ? '<div class="rq-detail" id="' + esc(v.id) + '-detail">' + detail(v, kind) + '</div>' : '') +
      '</article>';
    }

    /* ---- Detalle ------------------------------------------------------------- */
    function svcTags(ids) {
      return ids.length ? '<div class="rq-tags">' + ids.map(function (id) { return '<span class="op-tag" title="' + esc(serviceLabel(id)) + '">' + esc(serviceName(id)) + '</span>'; }).join('') + '</div>' : '<em>None</em>';
    }

    function detail(v, kind) {
      const trg = trigger(v);
      const c = companyOf(v);
      const adminLink = canAccessAdmin() && v.status !== 'queued'
        ? '<a class="rq-link" href="executions.html?id=' + esc(v.executionId) + '">See in Engine activity</a>' : '';

      if (kind === 'research') {
        const s = v.steps || {};
        function tl(title, text, state) {
          return '<li><span class="rq-dot' + (state === 'done' ? ' is-done' : state === 'fail' ? ' is-fail' : '') + '" aria-hidden="true"></span>' +
            '<div><div class="rq-tl-title">' + title + '</div><div class="rq-tl-text">' + text + '</div></div></li>';
        }
        const enrichTxt = ENRICH[s.enrichment] ? ENRICH[s.enrichment][0] + '.' : 'Pending.';
        const qualTxt = QUALIFY[s.qualification]
          ? QUALIFY[s.qualification][0] + (s.qualification === 'qualified' && c && c.icpScore != null ? ' · ICP score ' + Math.round(c.icpScore) + '.' : '.')
          : (s.enrichment === 'not_found' ? 'Company not found.' : 'Pending.');
        const dmTxt = s.decisionMakers !== undefined && s.decisionMakers !== null
          ? s.decisionMakers + ' decision maker' + (s.decisionMakers === 1 ? '' : 's') + '.'
          : (s.qualification && s.qualification !== 'qualified' ? 'Not qualified.' : 'Pending.');
        return '<section><h4>Steps</h4><ol class="rq-timeline">' +
            tl('Company enrichment', enrichTxt, s.enrichment === 'not_found' ? 'fail' : s.enrichment ? 'done' : '') +
            tl('Company analysis', qualTxt, s.qualification ? 'done' : '') +
            tl('Decision makers', dmTxt, s.decisionMakers !== undefined && s.decisionMakers !== null ? 'done' : '') +
          '</ol></section>' +
          '<section><h4>Result</h4>' +
            (c
              ? '<dl class="rq-dl"><dt>Company</dt><dd><a class="rq-link" href="company-detail.html?id=' + esc(c.id) + '">' + esc(c.name) + '</a></dd>' +
                '<dt>Current state</dt><dd>' + stateBadge(COMPANY_STATES, c.entityState) + '</dd>' +
                '<dt>Requested</dt><dd>' + esc(when(v.at)) + '</dd></dl>' +
                '<div class="rq-links"><a class="rq-link" href="company-detail.html?id=' + esc(c.id) + '&tab=history">Open the company history</a>' + adminLink + '</div>'
              : '<dl class="rq-dl"><dt>Company</dt><dd>' + esc(v.companyName || '') + '</dd><dt>Requested</dt><dd>' + esc(when(v.at)) + '</dd></dl>' +
                '<p class="rq-note">Company not found.</p>' +
                (adminLink ? '<div class="rq-links">' + adminLink + '</div>' : '')) +
          '</section>';
      }

      // Búsquedas: qué se buscó y qué trajo.
      const country = v.country || (c && c.countryCode) || 'US';
      const services = v.serviceIds || trg.vacancyServices[country] || [];
      const terms = (v.termIds && v.termIds.length)
        ? v.termIds.map(function (id) { const t = ENGINE_TERMS.find(function (x) { return x.id === id; }); return t ? t.text : ''; }).filter(Boolean)
        : ENGINE_TERMS.filter(function (t) { return t.country === country && trg.activeTerms.indexOf(t.id) >= 0 && (!(v.positionIds || []).length || v.positionIds.indexOf(t.positionId) >= 0); }).map(function (t) { return t.text; });
      const allCities = trg.locations.map(function (l) { return GEO_CITIES.find(function (g) { return g.id === l.cityId; }); }).filter(function (g) { return g && g.country === country; });
      const what = '<dt>Company</dt><dd>' + (c ? '<a class="rq-link" href="company-detail.html?id=' + esc(c.id) + '&tab=positions">' + esc(c.name) + '</a>' : esc(v.companyName || v.domain)) + '</dd>' +
        (v.domain || (c && c.domain) ? '<dt>Domain</dt><dd>' + esc(v.domain || c.domain) + '</dd>' : '') +
        '<dt>Country</dt><dd>' + esc(countryName(country)) + '</dd>' +
        '<dt>Positions</dt><dd>' + ((v.positionIds || []).length ? esc(v.positionIds.map(getPositionName).join(', ')) : 'All positions') + '</dd>' +
        '<dt>Terms</dt><dd>' + ((v.positionIds || []).length
          ? (terms.length ? '<div class="rq-tags">' + terms.map(function (t) { return '<span class="op-tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '<em>None active</em>')
          : 'All active terms (' + terms.length + ')') + '</dd>' +
        '<dt>Cities</dt><dd>' + ((v.cityIds || []).length ? esc(v.cityIds.map(cityName).join(', ')) : 'Whole country (' + allCities.length + ' cities)') + '</dd>';
      const left = '<section><h4>What was requested</h4><dl class="rq-dl">' + what +
        '<dt>Window</dt><dd>' + esc(windowLabel(v.windowDays)) + '</dd>' +
        '<dt>Services</dt><dd>' + svcTags(services) + '</dd>' +
        '<dt>Requested</dt><dd>' + esc(when(v.at)) + (canViewAll() ? ' · ' + esc(memberShort(v.requestedBy)) : '') + '</dd>' +
        '</dl></section>';

      const vacs = (v.vacancyIds || []).map(function (id) { return MOCK_VACANCIES.find(function (x) { return x.id === id; }); }).filter(Boolean);
      const p = v.progress || {};
      let right = '<section><h4>Openings found</h4>';
      if (v.status === 'queued') right += '<p class="rq-note">Waiting to start.</p>';
      else if (vacs.length) {
        right += '<ul class="rq-results">' + vacs.slice(0, 8).map(function (x) {
          const co = MOCK_COMPANIES.find(function (cc) { return cc.id === x.companyId; });
          return '<li><a href="vacancy-detail.html?id=' + esc(x.id) + '">' + esc(x.title) + (co ? ' · ' + esc(co.name) : '') + '</a>' +
            '<span class="rq-rmeta">' + stateBadge(VACANCY_STATES, x.entityState) + '</span></li>';
        }).join('') + '</ul>' +
          (vacs.length > 8 ? '<p class="rq-note">' + (vacs.length - 8) + ' more in Open Positions.</p>' : '');
      } else if (p.found) {
        right += '<p class="rq-note">' + p.found + ' opening' + (p.found === 1 ? '' : 's') + ' found, ' + (p.viable || 0) + ' viable. See them in Open Positions.</p>';
      } else if (v.status === 'no_results') {
        right += '<p class="rq-note">No openings found in the window.</p>';
      } else {
        right += '<p class="rq-note">No openings found yet.</p>';
      }
      right += '<div class="rq-links"><a class="rq-link" href="open-positions.html">Open Positions</a>' +
        (c ? '<a class="rq-link" href="company-detail.html?id=' + esc(c.id) + '&tab=positions">Company positions</a>' : '') + adminLink + '</div></section>';
      return left + right;
    }

    /* ---- Listado --------------------------------------------------------------- */
    function render() {
      const all = getVisibleRequests().slice().sort(function (a, b) { return parseStamp(b.at) - parseStamp(a.at); });
      const rows = all.filter(function (r) {
        const v = view(r);
        if (filters.type && kindOf(v) !== filters.type) return false;
        if (filters.status && v.status !== filters.status) return false;
        if (filters.by && v.requestedBy !== filters.by) return false;
        return true;
      });
      const active = all.filter(function (r) { const s = view(r).status; return s === 'queued' || s === 'running'; }).length;
      document.getElementById('rqCount').innerHTML = '<strong>' + rows.length + '</strong> request' + (rows.length === 1 ? '' : 's') +
        (active ? ' · <strong>' + active + '</strong> in progress' : '');

      const list = document.getElementById('rqList');
      if (!all.length) {
        list.innerHTML = '<div class="op-empty"><h3>No requests yet.</h3>' +
          '<button class="btn btn-primary" onclick="openScrapePopup({ onSent: render })">Request search</button></div>';
        return;
      }
      list.innerHTML = rows.length ? rows.map(renderRow).join('')
        : '<div class="op-empty"><h3>No requests match the filters.</h3>' +
          '<button class="btn btn-secondary" onclick="clearFilters()">Clear filters</button></div>';
      list.querySelectorAll('[data-toggle]').forEach(function (b) {
        b.onclick = function () {
          const id = b.getAttribute('data-toggle');
          if (open.has(id)) open.delete(id); else open.add(id);
          render();
        };
      });
    }

    function clearFilters() {
      filters.type = filters.status = filters.by = '';
      ['rqType', 'rqStatus', 'rqBy'].forEach(function (id) { document.getElementById(id).value = ''; });
      render();
    }

    document.addEventListener('DOMContentLoaded', function () {
      if (!initSession()) return;
      renderHeaderControls();
      renderSidebar('requests');

      document.getElementById('rqIntro').textContent = canViewAll()
        ? 'Searches and research requested by the team.'
        : 'Searches and research you requested.';

      document.getElementById('rqStatus').innerHTML = '<option value="">All statuses</option>' +
        Object.keys(REQUEST_STATUS).map(function (k) { return '<option value="' + k + '">' + esc(REQUEST_STATUS[k].label) + '</option>'; }).join('');
      const by = document.getElementById('rqBy');
      if (canViewAll()) {
        const ids = [];
        MOCK_REQUESTS.forEach(function (r) { if (r.requestedBy && ids.indexOf(r.requestedBy) < 0) ids.push(r.requestedBy); });
        by.innerHTML = '<option value="">Requested by anyone</option>' +
          ids.map(function (id) { return '<option value="' + esc(id) + '">' + esc((getMemberById(id) || { name: id }).name) + '</option>'; }).join('');
        by.hidden = false;
      }
      document.getElementById('rqType').onchange = function (e) { filters.type = e.target.value; render(); };
      document.getElementById('rqStatus').onchange = function (e) { filters.status = e.target.value; render(); };
      by.onchange = function (e) { filters.by = e.target.value; render(); };

      // ?id=req-… abre esa solicitud (lo usan los avisos de los popups).
      const deep = new URLSearchParams(window.location.search).get('id');
      if (deep) open.add(deep);
      render();
      if (deep && document.getElementById(deep)) document.getElementById(deep).scrollIntoView({ block: 'start' });

      // Las solicitudes en curso avanzan solas mientras la página está abierta.
      setInterval(function () {
        if (getVisibleRequests().some(function (r) { const s = view(r).status; return s === 'queued' || s === 'running'; })) render();
      }, 20000);
    });
  </script>
</body>
</html>
