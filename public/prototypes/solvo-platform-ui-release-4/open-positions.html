      },
      {
        key: 'sdr', group: 'Assignment', label: 'SDR', type: 'search', def: [],
        hint: 'SDR assigned to the position.',
        placeholder: 'Search by name or email',
        gated: function () { return canViewAll(); },
        options: function () {
          return [{ value: 'unassigned', label: 'Unassigned', note: 'No SDR on the position' }].concat(
            getActiveSDRs().map(function (m) { return { value: m.id, label: m.name, note: m.email }; }));
        },
        chip: function (v) { return 'SDR: ' + v.length; },
        test: function (vac, v) { return v.indexOf(vac.sdrId || 'unassigned') !== -1; }
      },
      {
        key: 'assignType', group: 'Assignment', label: 'Assignment type', type: 'single', cols: 1, def: '',
        hint: 'Whether the assignment comes from the company or was set on the position.',
        gated: function () { return canViewAll(); },
        options: [
          { value: '', label: 'All' },
          { value: 'inherited', label: 'Inherited from the company' },
          { value: 'direct', label: 'Set on the position' }
        ],
        chip: function (v) { return 'Assignment: ' + v; },
        test: function (vac, v) { return vac.comercialType === v || vac.sdrType === v; }
      }
    ];

    function visibleFilters() {
      return FILTERS.filter(function (f) { return !f.gated || f.gated(); });
    }

    function filterOptions(f) {
      return typeof f.options === 'function' ? f.options() : (f.options || []);
    }

    // --- Ayudas de Release 4: ciudades, países y roles ------------------------
    function geoCity(id) { return GEO_CITIES.find(function (c) { return c.id === id; }) || null; }

    // placeLabel repite el nombre cuando la ciudad y su división se llaman igual
    // ("Madrid, Madrid · Spain"); en la card se dice una vez.
    function place(v) { return placeLabel(v).replace(/^([^,·]+), \1(?= ·|$)/, '$1'); }

    // Etiqueta de rol desde la tabla de roles de decisor; los códigos de Release 3 que
    // no están en ella conservan su etiqueta anterior.
    function roleLabel(code) { const r = decisionRole(code); return r ? r.label : roleCodeLabel(code); }

    // Países que el criterio de país deja ver: el neutro (ninguno marcado) son todos.
    function countriesIn(filters) {
      const v = filters.country;
      return v && v.length ? v.slice() : ALL_COUNTRIES.slice();
    }

    // Las desmarcadas de un país que ya no está elegido no recortan nada y confundirían
    // al chip: se descartan cada vez que cambia el país.
    function pruneCities(filters) {
      const allowed = countriesIn(filters);
      filters.cities = (filters.cities || []).filter(function (id) {
        const c = geoCity(id);
        return c && allowed.indexOf(c.country) !== -1;
      });
    }

    // "Cities: US 5 of 13" — un país recortado; "Cities: US 5 of 13, ES 2 of 7" — dos;
    // con más, el total.
    function citiesChip(unchecked, filters) {
      const countries = countriesIn(filters || state.filters);
      const narrowed = countries.filter(function (code) {
        return unchecked.some(function (id) { const c = geoCity(id); return c && c.country === code; });
      }).map(function (code) {
        const total = GEO_CITIES.filter(function (c) { return c.country === code; }).length;
        const off = unchecked.filter(function (id) { const c = geoCity(id); return c && c.country === code; }).length;
        return { code: code, on: total - off, total: total };
      });
      if (narrowed.length <= 2) return 'Cities: ' + narrowed.map(function (n) { return n.code + ' ' + n.on + ' of ' + n.total; }).join(', ');
      const on = narrowed.reduce(function (a, n) { return a + n.on; }, 0);
      const total = narrowed.reduce(function (a, n) { return a + n.total; }, 0);
      return 'Cities: ' + on + ' of ' + total + ' in ' + narrowed.length + ' countries';
    }

    /* Lista de ciudades por país, con casillas. Componente de la página, reutilizable:
         renderCityChecklist(container, { countries, selected, onChange, idPrefix, cities })
         countries  códigos de país a mostrar, en ese orden (un acordeón por país)
         selected   ids de ciudad marcados
         onChange   recibe los ids marcados después de cada cambio
         cities     opcional: [{ id, name, country, division }]; por defecto GEO_CITIES
       Las listas pueden crecer mucho, así que:
         · cada país es un acordeón: cabecera con chevron, nombre, "N of M selected" y
           All / None, que funcionan con el grupo cerrado. Arrancan cerrados; si hay un
           solo país, abierto.
         · adentro, 24 ciudades por página con un paginador compacto.
         · el buscador (sin acentos ni mayúsculas) filtra en todos los países: abre los
           grupos con coincidencias, oculta los demás y lleva cada grupo a la página 1;
           al vaciarlo vuelve el estado abierto/cerrado de antes. Con búsqueda activa,
           All / None actúan sobre las coincidencias de ese país; sin búsqueda, sobre
           todas sus ciudades.
       El componente repinta solo sus grupos, nunca el buscador: escribir y marcar no
       pierden el foco. */
    const CITYLIST_PAGE = 24;
    const ICON_CHEVRON = '<svg class="r4-citylist-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>';

    function renderCityChecklist(container, options) {
      const opts = options || {};
      const prefix = opts.idPrefix || 'cl';
      const source = opts.cities || GEO_CITIES;
      const checked = new Set(opts.selected || []);
      function fold(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

      const groups = (opts.countries || []).map(function (code) {
        return {
          code: code,
          cities: source.filter(function (c) { return c.country === code; })
            .sort(function (a, b) { return a.name.localeCompare(b.name); })
            .map(function (c) { return Object.assign({ key: fold(c.name) }, c); })
        };
      }).filter(function (g) { return g.cities.length; });

      const ui = { query: '', expanded: new Set(groups.length === 1 ? [groups[0].code] : []), saved: null, page: {} };

      container.innerHTML =
        '<div class="r4-citylist">' +
          (groups.length
            ? '<input type="search" class="r4-citylist-search" id="' + prefix + '-q" placeholder="Search city" autocomplete="off" aria-label="Search city">' +
              '<div id="' + prefix + '-groups"></div>' +
              '<p class="r4-citylist-empty" id="' + prefix + '-empty" hidden>No city matches that search.</p>'
            : '<p class="r4-citylist-empty">The selected countries have no cities in the catalog.</p>') +
        '</div>';
      if (!groups.length) return { getSelected: function () { return Array.from(checked); } };

      const search = document.getElementById(prefix + '-q');
      const mount = document.getElementById(prefix + '-groups');

      function matches(g) {
        const q = fold(ui.query.trim());
        return q ? g.cities.filter(function (c) { return c.key.indexOf(q) !== -1; }) : g.cities;
      }

      function pager(code, page, pages, total) {
        if (pages <= 1) return '';
        const from = (page - 1) * CITYLIST_PAGE + 1, to = Math.min(page * CITYLIST_PAGE, total);
        let nums = '';
        if (pages <= 7) {
          for (let i = 1; i <= pages; i++) {
            nums += '<button type="button" data-page="' + code + ':' + i + '"' + (i === page ? ' aria-current="page"' : '') + '>' + i + '</button>';
          }
        }
        return '<div class="r4-citylist-pager">' +
          '<span class="r4-citylist-range">' + from + '–' + to + ' of ' + total + '</span>' +
          '<button type="button" data-page="' + code + ':' + (page - 1) + '"' + (page === 1 ? ' disabled' : '') + ' aria-label="Previous page">Prev</button>' +
          nums +
          '<button type="button" data-page="' + code + ':' + (page + 1) + '"' + (page === pages ? ' disabled' : '') + ' aria-label="Next page">Next</button>' +
        '</div>';
      }

      function paint() {
        let any = false;
        mount.innerHTML = groups.map(function (g) {
          const list = matches(g);
          if (!list.length) return '';
          any = true;
          const open = ui.expanded.has(g.code);
          const on = g.cities.filter(function (c) { return checked.has(c.id); }).length;
          const pages = Math.max(1, Math.ceil(list.length / CITYLIST_PAGE));
          const page = Math.min(ui.page[g.code] || 1, pages);
          const slice = list.slice((page - 1) * CITYLIST_PAGE, page * CITYLIST_PAGE);
          const bodyId = prefix + '-body-' + g.code;
          return '<section class="r4-citylist-group" data-country="' + g.code + '">' +
            '<div class="r4-citylist-head" aria-expanded="' + open + '">' +
              '<button type="button" class="r4-citylist-toggle" data-toggle="' + g.code + '" aria-expanded="' + open + '" aria-controls="' + bodyId + '">' +
                ICON_CHEVRON + '<span class="r4-citylist-name">' + esc(countryName(g.code)) + '</span>' +
              '</button>' +
              '<span class="r4-citylist-count">' + on + ' of ' + g.cities.length + ' selected' +
                (ui.query.trim() ? ' · ' + list.length + ' match' + (list.length === 1 ? '' : 'es') : '') + '</span>' +
              '<span class="r4-citylist-actions">' +
                '<button type="button" data-all="' + g.code + '">All</button>' +
                '<button type="button" data-none="' + g.code + '">None</button>' +
              '</span>' +
            '</div>' +
            '<div class="r4-citylist-body" id="' + bodyId + '"' + (open ? '' : ' hidden') + '>' +
              (open ? '<div class="r4-citylist-grid">' + slice.map(function (c) {
                return '<label class="r4-citylist-item" title="' + esc(c.name + (c.division ? ', ' + divisionName(c.division) : '')) + '">' +
                  '<input type="checkbox" value="' + esc(c.id) + '"' + (checked.has(c.id) ? ' checked' : '') + '>' +
                  '<span>' + esc(c.name) + '</span></label>';
              }).join('') + '</div>' + pager(g.code, page, pages, list.length) : '') +
            '</div>' +
          '</section>';
        }).join('');
        document.getElementById(prefix + '-empty').hidden = any;

        mount.querySelectorAll('input[type="checkbox"]').forEach(function (cb) {
          cb.onchange = function () {
            if (cb.checked) checked.add(cb.value); else checked.delete(cb.value);
            const count = cb.closest('.r4-citylist-group').querySelector('.r4-citylist-count');
            const g = groups.find(function (x) { return x.code === cb.closest('.r4-citylist-group').dataset.country; });
            const list = matches(g);
            count.textContent = g.cities.filter(function (c) { return checked.has(c.id); }).length + ' of ' + g.cities.length + ' selected' +
              (ui.query.trim() ? ' · ' + list.length + ' match' + (list.length === 1 ? '' : 'es') : '');
            if (opts.onChange) opts.onChange(Array.from(checked));
          };
        });
        mount.querySelectorAll('[data-toggle]').forEach(function (b) {
          b.onclick = function () {
            const code = b.dataset.toggle;
            if (ui.expanded.has(code)) ui.expanded.delete(code); else ui.expanded.add(code);
            paint();
            const again = mount.querySelector('[data-toggle="' + code + '"]');
            if (again) again.focus();
          };
        });
        mount.querySelectorAll('[data-page]').forEach(function (b) {
          b.onclick = function () {
            const parts = b.dataset.page.split(':');
            ui.page[parts[0]] = Number(parts[1]);
            paint();
          };
        });
        function setGroup(code, on) {
          const g = groups.find(function (x) { return x.code === code; });
          matches(g).forEach(function (c) { if (on) checked.add(c.id); else checked.delete(c.id); });
          paint();
          if (opts.onChange) opts.onChange(Array.from(checked));
        }
        mount.querySelectorAll('[data-all]').forEach(function (b) { b.onclick = function () { setGroup(b.dataset.all, true); }; });
        mount.querySelectorAll('[data-none]').forEach(function (b) { b.onclick = function () { setGroup(b.dataset.none, false); }; });
      }

      // Al empezar a buscar se guarda qué estaba abierto; al vaciar el buscador, vuelve.
      search.oninput = function () {
        const had = !!ui.query.trim();
        ui.query = search.value;
        const has = !!ui.query.trim();
        if (has && !had) ui.saved = new Set(ui.expanded);
        if (has) ui.expanded = new Set(groups.filter(function (g) { return matches(g).length; }).map(function (g) { return g.code; }));
        if (!has && had) { ui.expanded = ui.saved || new Set(); ui.saved = null; }
        ui.page = {};
        paint();
      };
      paint();

      return {
        getSelected: function () { return Array.from(checked); },
        focusSearch: function () { search.focus(); }
      };
    }

    function defaultFor(f) {
      if (Array.isArray(f.def)) return f.def.slice();
      // Un default que es objeto se clona: compartir la referencia haría que limpiar
      // un criterio escribiera sobre el default de la declaración.
      if (f.def && typeof f.def === 'object') return { mode: f.def.mode, roles: [] };
      return f.def;
    }


    function resetFilters(target) {
      visibleFilters().forEach(function (f) { target[f.key] = defaultFor(f); });
    }

    // Un valor es neutro cuando no recorta nada. Es lo único que exime a un criterio
    // de evaluarse: que además coincida con su valor por defecto es irrelevante, porque
    // hay defaults que recortan a propósito.
    // El valor con que un criterio deja de recortar. Es a donde va "limpiar":
    // no al valor por defecto, que en varios criterios sí recorta.
    function neutralFor(f) {
      if (f.neutral !== undefined) {
        if (Array.isArray(f.neutral)) return f.neutral.slice();
        return (f.neutral && typeof f.neutral === 'object') ? { mode: f.neutral.mode, roles: [] } : f.neutral;
      }
      if (Array.isArray(f.def)) return [];
      if (f.type === 'dm') return { mode: 'all', roles: [] };
      if (f.type === 'daterange') return 'all';
      return '';
    }

    // "Clear all": cada criterio a su neutro, salvo los que declaran `clearTo: 'def'` —el
    // país—, que vuelven a su default.
    function clearFilters(target) {
      visibleFilters().forEach(function (f) { target[f.key] = f.clearTo === 'def' ? defaultFor(f) : neutralFor(f); });
      pruneCities(target);
    }

    function isNeutral(f, v) {
      if (f.type === 'multi' || f.type === 'search' || f.type === 'cities') return !v || !v.length;
      if (f.type === 'text') return !v;
      if (f.type === 'daterange') return !v || v === 'all';
      if (f.type === 'dm') return !v || (v.mode === 'all' && !(v.roles || []).length);
      // En los radios "All" es el valor vacío, salvo donde el criterio lo expresa con
      // un valor propio —`all` en viabilidad, `include` en empresas excluidas—.
      return v === '' || v === undefined || (f.neutral !== undefined && v === f.neutral);
    }

    // --- Recorte del listado -------------------------------------------------
    function matches(vac) {
      if (state.q) {
        // El campo de texto busca en el aviso: su título y su descripción. La empresa,
        // la posición del catálogo y el estado tienen su propio selector.
        const hay = [vac.title, vac.description].join(' ').toLowerCase();
        if (hay.indexOf(state.q.toLowerCase()) === -1) return false;
      }
      return visibleFilters().every(function (f) {
        const value = state.filters[f.key];
        return isNeutral(f, value) ? true : f.test(vac, value);
      });
    }

    function sortResults(list) {
      const by = state.sort;
      return list.slice().sort(function (a, b) {
        if (by === 'detected_desc' || by === 'detected_asc') {
          const d = new Date(a.detectedAtTs || a.detectedAt) - new Date(b.detectedAtTs || b.detectedAt);
          return by === 'detected_desc' ? -d : d;
        }
        if (by === 'icp_desc') {
          const sa = (company(a) || {}).icpScore, sb = (company(b) || {}).icpScore;
          return (sb === null || sb === undefined ? -1 : sb) - (sa === null || sa === undefined ? -1 : sa);
        }
        if (by === 'salary_desc') return (b.salaryMaxUsd || 0) - (a.salaryMaxUsd || 0);
        if (by === 'company_asc') return ((company(a) || {}).name || '').localeCompare((company(b) || {}).name || '');
        return a.title.localeCompare(b.title);
      });
    }

    // --- Card ----------------------------------------------------------------
    const ICON_BUILDING = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg>';
    const ICON_PIN = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>';

    function icpBadge(c) {
      const tier = icpTier(c);
      if (tier === 'excluded') {
        return '<span class="op-cbadge op-cbadge-excluded" title="Disqualified: ' +
          esc(leadSignalLabel(c.exclusionReason)) + '">Excluded</span>';
      }
      if (tier === 'pending') return '<span class="op-cbadge" title="Not researched yet">Not scored</span>';
      const cls = tier === 'strong' ? ' op-cbadge-icp' : tier === 'moderate' ? ' op-cbadge-icp-mod' : '';
      return '<span class="op-cbadge' + cls + '" title="ICP score ' + c.icpScore + ' of 100">ICP ' + Math.round(c.icpScore) + (tier === 'strong' ? ' Strong' : tier === 'moderate' ? ' Moderate' : '') + '</span>';
    }

    function renderCard(vac) {
      const c = company(vac) || {};
      const dms = getDecisionMakers(vac.companyId).map(function (d) { return Object.assign({}, d, { label: roleLabel(d.roleCode) }); });
      const salary = salaryUsdLabel(vac);
      const published = salaryPublishedLabel(vac);
      const speaksSpanish = (vac.languages || []).indexOf('Spanish') !== -1;

      let tags = '';
      if (vac.positionId) tags += '<span class="op-tag op-tag-position" title="Catalog position — found with “' + esc(vac.searchText) + '”">' + esc(getPositionName(vac.positionId)) + '</span>';
      // USD anual primero; el publicado, cuando no es USD por año, al lado y en gris.
      if (salary) {
        tags += '<span class="op-tag op-tag-salary" title="Annual salary in USD' + (published ? ' · published as ' + esc(published) : '') + '">' + esc(salary) +
          (published ? '<span class="r4-pub">' + esc(published) + '</span>' : '') + '</span>';
      }
      if (vac.seniorityLevel) tags += '<span class="op-tag">' + esc(seniorityLabel(vac.seniorityLevel)) + '</span>';
      if (speaksSpanish) tags += '<span class="op-tag op-tag-lang">Spanish</span>';

      // Señales del aviso: las que cambian la urgencia van primero y el resto se cuenta.
      const posted = (vac.aiSignals || []);
      const leadSignalsOfPosting = posted.filter(function (x) { return vacancySignalTone(x) !== 'plain'; });
      const shownSignals = (leadSignalsOfPosting.length ? leadSignalsOfPosting : posted).slice(0, 2);
      shownSignals.forEach(function (x) {
        tags += '<span class="op-tag op-tag-signal is-' + vacancySignalTone(x) + '">' + esc(vacancySignalLabel(x)) + '</span>';
      });
      if (posted.length > shownSignals.length) {
        tags += '<span class="op-tag op-tag-more" title="' + esc(posted.filter(function (x) { return shownSignals.indexOf(x) === -1; }).map(vacancySignalLabel).join(', ')) +
          '">+' + (posted.length - shownSignals.length) + '</span>';
      }

      // Señales: la primera y el resto contado. Son el "por qué ahora" de la empresa,
      // pero la card se lee de un vistazo: el detalle completo vive en su ficha.
      const signals = (c.leadSignals || []).filter(function (s) {
        return !(LEAD_SIGNALS.find(function (x) { return x.code === s; }) || {}).disqualifying;
      });
      let signalBadges = signals.slice(0, 1).map(function (s) {
        return '<span class="op-cbadge op-cbadge-signal' + (leadSignalTone(s) === 'hot' ? ' is-hot' : '') + '">' + esc(leadSignalLabel(s)) + '</span>';
      }).join('');
      if (signals.length > 1) {
        signalBadges += '<span class="op-cbadge op-cbadge-signal" title="' + esc(signals.slice(1).map(leadSignalLabel).join(', ')) + '">+' + (signals.length - 1) + ' more</span>';
      }

      // Sin decisores hay tres situaciones: la empresa quedó excluida, no se encontraron
      // decisores, o todavía no se buscaron. Se dice cuál, sin explicar el porqué.
      const otherContacts = getUnanalyzedContacts(c.id).length;
      let dmRow;
      if (!dms.length) {
        const why = c.isExcluded
          ? 'Excluded company'
          : c.contactsSearchedAt
            ? 'No qualifying decision makers found'
            : 'Decision makers not searched yet';
        dmRow = '<span class="op-dm-none">' + why + '</span>' +
          (otherContacts ? '<span class="op-dm-badge" title="Contacts without a role or decision level">' +
            otherContacts + ' other contact' + (otherContacts === 1 ? '' : 's') + '</span>' : '');
      } else {
        dmRow = '<span class="op-dm-label">Decision makers <strong>' + dms.reduce(function (n, d) { return n + d.people.length; }, 0) +
          '</strong></span><span class="op-dm-badges">' +
          dms.slice(0, 3).map(function (d) {
            const who = d.people.map(function (p) {
              const ver = EMAIL_VERIFICATION[p.emailVerification] || EMAIL_VERIFICATION.unknown;
              return p.fullName + ' — ' + ver.label.toLowerCase();
            }).join(' · ');
            return '<span class="op-dm-badge' + (d.level === 1 ? ' is-level1' : '') + '" title="Level ' + d.level + ' · ' + esc(who) + '">' + esc(d.label) + ' Level ' + d.level + '</span>';
          }).join('') +
          (dms.length > 3 ? '<span class="op-dm-badge" title="' + esc(dms.slice(3).map(function (d) { return d.label; }).join(', ')) + '">+' + (dms.length - 3) + '</span>' : '') +
          (otherContacts ? '<span class="op-dm-badge" title="Contacts without a role or decision level">' +
            otherContacts + ' other</span>' : '') +
          '</span>';
      }

      // El estado solo se marca cuando no es el habitual: viable es lo que el listado muestra
      // por defecto y repetirlo en cada card no dice nada.
      const viability = vac.entityState && vac.entityState !== 'viable'
        ? '<span title="' + esc(vac.entityState === 'discarded' ? (vac.aiReasons || [])[0] || '' : 'Vacancy state') + '">' + stateBadge(VACANCY_STATES, vac.entityState) + '</span>'
        : '';

      // Origen: el trigger que la trajo y una ficha por servicio que la encontró.
      const services = [];
      (vac.sources || []).forEach(function (s) { if (services.indexOf(s.serviceId) === -1) services.push(s.serviceId); });
      const origin = '<div class="r4-origin">' +
        '<span class="r4-trigger" title="Trigger">' + esc((vac.triggerIds || []).map(triggerName).join(' · ')) + '</span>' +
        (services.length ? '<span class="vd-dot" aria-hidden="true">·</span><span class="r4-srcs">' + services.map(function (id) {
          const src = vac.sources.filter(function (s) { return s.serviceId === id; })[0];
          return '<span class="op-portal op-portal-' + esc(id.replace('svc-', '')) + '" title="Found by ' + esc(serviceLabel(id)) +
            (src && src.term ? ' with “' + esc(src.term) + '”' : '') + '">' + esc(serviceName(id)) + '</span>';
        }).join('') + '</span>' : '') +
      '</div>';

      return '<article class="op-card' + (c.isExcluded ? ' is-excluded' : '') + '">' +
        '<div class="op-card-head">' +
          '<a class="op-card-title" href="vacancy-detail.html?id=' + esc(vac.id) + '">' + esc(vac.title) + '</a>' +
          '<span class="op-age" title="Detected ' + esc(vac.detectedAt) + '">' + esc(detectedAge(vac)) + '</span>' +
        '</div>' +
        '<div class="op-card-loc">' + ICON_PIN +
          '<span>' + esc(place(vac)) + ' · ' + esc(modalityLabel(vac.workModality)) + '</span>' +
        '</div>' +
        origin +
        '<div class="op-tagrow">' + tags + viability + '</div>' +
        '<p class="op-card-desc">' + esc(vac.description) + '</p>' +
        '<div class="op-company">' +
          '<span class="op-cicon' + (c.type === 'client' ? ' is-client' : '') + '" aria-hidden="true">' + ICON_BUILDING + '</span>' +
          '<div class="op-cbody">' +
            '<div class="op-crow">' +
              '<a class="op-cname" href="company-detail.html?id=' + esc(c.id) + '" title="' + esc(c.name) + '">' + esc(c.name) + '</a>' +
              icpBadge(c) +
            '</div>' +
            '<div class="op-cbadges">' +
              (c.sizeEmployees ? '<span class="op-cbadge">' + Number(c.sizeEmployees).toLocaleString('en-US') + ' employees</span>' : '<span class="op-cbadge">Size unknown</span>') +
              (c.industryCode ? '<span class="op-cbadge">' + esc(getIndustryLabel(c.industryCode)) + '</span>' : '') +
              signalBadges +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="op-dm">' + dmRow + '</div>' +
      '</article>';
    }

    // --- Render del listado ---------------------------------------------------
    function render() {
      const all = sortResults(getVisibleVacancies().filter(matches));
      const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
      if (state.page > pages) state.page = pages;
      const slice = all.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);
      const companies = new Set(all.map(function (v) { return v.companyId; }));

      document.getElementById('resultCount').innerHTML =
        '<strong>' + all.length + '</strong> ' + (all.length === 1 ? 'position' : 'positions') +
        ' · <strong>' + companies.size + '</strong> ' + (companies.size === 1 ? 'company' : 'companies');

      const grid = document.getElementById('resultGrid');
      grid.innerHTML = slice.length
        ? slice.map(renderCard).join('')
        : '<div class="op-empty"><h3>No positions match the filters.</h3>' +
          emptyStateHint() +
          '<button class="btn btn-secondary" onclick="clearEverything()">Clear search and filters</button></div>';
      fitTagRows(grid);

      const exportBtn = document.getElementById('exportBtn');
      exportBtn.style.display = canExportPositions() ? '' : 'none';
      exportBtn.onclick = function () { handleExport(all); };

      renderPagination(all.length, pages);
      renderFilterBar();
    }


    // Varios criterios arrancan recortando —viables, con decisores—: el vacío nombra los
    // que siguen activos desde el default, en una línea.
    function emptyStateHint() {
      const active = visibleFilters()
        .filter(function (f) { return !isNeutral(f, state.filters[f.key]) && !isNeutral(f, defaultFor(f)); })
        .map(function (f) { return f.chip(state.filters[f.key]); });
      return active.length ? '<p>On by default: ' + esc(active.join(' · ')) + '.</p>' : '';
    }

    function renderPagination(total, pages) {
      const el = document.getElementById('pagination');
      if (!total) { el.innerHTML = ''; return; }
      const from = (state.page - 1) * PAGE_SIZE + 1;
      const to = Math.min(state.page * PAGE_SIZE, total);

      // Ventana de páginas alrededor de la actual, con la primera y la última siempre a la vista.
      const nums = [];
      for (let i = 1; i <= pages; i++) {
        if (i === 1 || i === pages || Math.abs(i - state.page) <= 1) nums.push(i);
        else if (nums[nums.length - 1] !== '…') nums.push('…');
      }

      el.innerHTML =
        '<div class="op-pag-info">Showing ' + from + '–' + to + ' of ' + total + '</div>' +
        '<div class="op-pag-controls">' +
          '<button class="op-pag-btn" ' + (state.page === 1 ? 'disabled' : '') + ' onclick="goPage(' + (state.page - 1) + ')">Previous</button>' +
          nums.map(function (n) {
            return n === '…'
              ? '<span class="op-pag-gap">…</span>'
              : '<button class="op-pag-btn' + (n === state.page ? ' is-current' : '') + '" ' +
                (n === state.page ? 'aria-current="page"' : '') + ' onclick="goPage(' + n + ')">' + n + '</button>';
          }).join('') +
          '<button class="op-pag-btn" ' + (state.page === pages ? 'disabled' : '') + ' onclick="goPage(' + (state.page + 1) + ')">Next</button>' +
        '</div>';
    }

    function goPage(n) {
      state.page = n;
      render();
      document.querySelector('.page-content').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // --- Exportación ------------------------------------------------------------
    // El archivo de posiciones hereda el recorte del listado y ya lleva los correos de los
    // decisores de cada empresa, así que se puede trabajar solo. El acompañante agrega las
    // personas de esas empresas, una fila por contacto; una empresa sin contactos no aporta filas.
    // Columnas de Release 4. Se arman a partir del contrato de rbac: País, División y
    // Ciudad van detrás de Ubicación; Trigger delante de Fuentes, que ocupa el lugar de
    // Fuente (el portal), porque una vacante puede tener varias. Los encabezados siguen
    // en español: son contrato.
    const EXPORT_COLUMNS_VACANCIES_R4 = (function () {
      const cols = EXPORT_COLUMNS_VACANCIES.slice();
      cols.splice(cols.indexOf('Ubicación') + 1, 0, 'País', 'División', 'Ciudad');
      cols.splice(cols.indexOf('Fuente'), 1, 'Trigger', 'Fuentes');
      return cols;
    })();

    // Extiende la fila de rbac una vacante a la vez: buildVacancyExportRows ordena, así que
    // armarlas juntas perdería la correspondencia fila ↔ vacante. El orden del contrato
    // (detección descendente, empresa ascendente) se aplica al final.
    function buildVacancyExportRowsR4(vacancies) {
      const rows = vacancies.map(function (v) {
        const row = buildVacancyExportRows([v])[0];
        delete row['Fuente'];
        const services = [];
        (v.sources || []).forEach(function (s) { if (services.indexOf(s.serviceId) === -1) services.push(s.serviceId); });
        return Object.assign(row, {
          'País': countryName(v.countryCode),
          'División': v.divisionCode ? divisionName(v.divisionCode) : '',
          // La ciudad fuera del catálogo se entrega como la publicó el aviso.
          'Ciudad': v.cityId ? cityName(v.cityId) : (v.cityRaw || ''),
          'Trigger': (v.triggerIds || []).map(triggerName).join(' | '),
          'Fuentes': services.map(serviceName).join(' | ')
        });
      });
      return sortForExport(rows, 'Detectada', 'Empresa');
    }

    function handleExport(vacancies) {
      const range = (state.filters.detected && state.filters.detected.from) ? state.filters.detected : { from: '', to: '' };
      const ids = new Set(vacancies.map(function (v) { return v.companyId; }));
      // Sales Rep y SDR exportan su cartera: el acompañante de prospectos solo trae las empresas que
      // tienen asignadas, el popup no les muestra el aviso de ya exportadas y su exportación no deja
      // la marca. Para coordinación getVisibleCompanies() es todo el catálogo.
      const tracksStatus = tracksExportStatus();
      const relatedCompanies = getVisibleCompanies().filter(function (c) { return ids.has(c.id); });
      const relatedContacts = relatedCompanies.reduce(function (acc, c) { return acc.concat(getContactsForCompany(c.id)); }, []);
      const contactRows = relatedContacts.length;

      openExportPopup({
        entityLabel: 'positions',
        entityCount: vacancies.length,
        alreadyExported: tracksStatus ? countAlreadyExported(vacancies) : 0,
        companions: [
          { key: 'prospects', label: 'Include prospects', count: contactRows, note: 'one row per contact of those companies' }
        ],
        onExport: function (selected) {
          const files = [{ entity: 'posiciones', rows: buildVacancyExportRowsR4(vacancies), columns: EXPORT_COLUMNS_VACANCIES_R4 }];
          if (selected.indexOf('prospects') !== -1) files.push({ entity: 'prospectos', rows: buildProspectExportRows(relatedCompanies, exportFilename('prospectos', range.from, range.to).replace(/\.csv$/, '')), columns: EXPORT_COLUMNS_PROSPECTS });
          deliverExport(files, range.from, range.to);
          if (tracksStatus) {
            markExported(vacancies);
            if (selected.indexOf('prospects') !== -1) { markExported(relatedCompanies); markExported(relatedContacts); }
          }
          render();
        }
      });
    }

    // --- Barra de filtros activos --------------------------------------------
    function activeChips() {
      const chips = [];
      if (state.q) chips.push({ key: '__q', text: '“' + state.q + '”' });
      visibleFilters().forEach(function (f) {
        const v = state.filters[f.key];
        if (isNeutral(f, v)) return;
        if ((f.type === 'multi' || f.type === 'search' || f.type === 'cities') && (!v || !v.length)) return;
        if (f.type === 'text' && !v) return;
        const text = f.chip(v);
        if (text) chips.push({ key: f.key, text: text });
      });
      return chips;
    }

    function renderFilterBar() {
      const chips = activeChips();
      const filterCount = chips.filter(function (c) { return c.key.indexOf('__') !== 0; }).length;
      document.getElementById('filterBar').innerHTML =
        '<button type="button" class="op-filters-open" id="openFilters">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"></line><line x1="7" x2="17" y1="12" y2="12"></line><line x1="10" x2="14" y1="18" y2="18"></line></svg>' +
          'Filters' + (filterCount ? '<span class="op-filters-count">' + filterCount + '</span>' : '') +
        '</button>' +
        chips.map(function (c) {
          // El texto del chip abre su criterio en el popup; la × lo lleva al neutro.
          return '<span class="op-chip">' + (c.key.indexOf('__') === 0
              ? '<span>' + esc(c.text) + '</span>'
              : '<button type="button" class="r4-chiplink" data-open="' + esc(c.key) + '" title="Edit this filter">' + esc(c.text) + '</button>') +
            '<button class="op-chip-x" aria-label="Remove filter" data-clear="' + esc(c.key) + '">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></span>';
        }).join('') +
        (chips.length ? '<button type="button" class="op-clearall" onclick="clearEverything()">Clear all</button>' : '');

      document.getElementById('openFilters').onclick = function () { openFilterModal(); };
      document.querySelectorAll('[data-open]').forEach(function (b) {
        b.onclick = function () { openFilterModal(b.dataset.open); };
      });
      document.querySelectorAll('[data-clear]').forEach(function (btn) {
        btn.onclick = function () { clearOne(btn.dataset.clear); };
      });
    }

    function clearOne(key) {
      if (key === '__q') { state.q = ''; document.getElementById('searchInput').value = ''; }
      else {
        const f = FILTERS.find(function (x) { return x.key === key; });
        state.filters[key] = neutralFor(f);
        if (key === 'country') pruneCities(state.filters);
        syncShellPickers();
      }
      state.page = 1;
      render();
    }

    function clearEverything() {
      state.q = '';
      state.page = 1;
      clearFilters(state.filters);
      document.getElementById('searchInput').value = '';
      syncShellPickers();
      render();
    }

    // --- Selectores de la barra de búsqueda ---------------------------------
    // Empresa y posición del catálogo. Los dos escriben el mismo criterio que sus
    // entradas del popup, así que elegir en un lado se ve en el otro.
    let shellPickers = {};

    // El campo de texto es lo único que espera al botón: buscar en el aviso puede ser
    // caro y se dispara cuando la persona terminó de escribir.
    function commitSearch() {
      state.q = document.getElementById('searchInput').value.trim();
      state.page = 1;
      render();
    }

    // Los tres filtros de al lado se aplican al elegir.
    function applyQuick(key, value) {
      state.filters[key] = value;
      if (key === 'country') pruneCities(state.filters);
      state.page = 1;
      render();
    }

    function mountShellPickers() {
      shellPickers.company = renderShellSearchbox('pickCompany', {
        icon: SHELL_ICONS.company,
        placeholder: 'Company',
        items: MOCK_COMPANIES.slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
          .map(function (c) { return { value: c.id, label: c.name, note: c.location }; }),
        value: state.filters.company,
        onChange: function (v) { applyQuick('company', v); }
      });

      shellPickers.position = renderShellPicker('pickPosition', {
        icon: SHELL_ICONS.position,
        allLabel: 'All positions',
        plural: 'positions',
        search: false,
        items: POSITIONS_CATALOG.map(function (x) { return { value: x.id, label: x.name }; })
          .concat([{ value: 'none', label: 'No catalog position' }]),
        value: state.filters.position,
        onChange: function (v) { applyQuick('position', v); }
      });

      // País: el mismo criterio que el popup. Con uno o dos países elegidos el selector
      // los nombra; con más, los cuenta.
      shellPickers.country = renderShellPicker('pickCountry', {
        icon: SHELL_ICONS.location,
        allLabel: 'All countries',
        plural: 'countries',
        search: false,
        items: ENGINE_COUNTRIES.map(function (c) { return { value: c.code, label: c.name, note: c.group === 'sales' ? 'Sales' : 'Hiring' }; }),
        value: state.filters.country,
        onChange: function (v) { applyQuick('country', v); }
      });
      nameCountries();
    }

    // renderShellPicker cuenta a partir de dos ("2 countries"); para el default, que son
    // dos, decir cuáles es más claro. Se observa la etiqueta porque el selector la repinta.
    function nameCountries() {
      const el = document.getElementById('pickCountry-value');
      if (!el) return;
      const fix = function () {
        const v = state.filters.country || [];
        if (v.length === 2) {
          const txt = v.map(function (c) { return c === 'US' ? 'US' : countryName(c); }).join(' + ');
          if (el.textContent !== txt) el.textContent = txt;
        }
      };
      new MutationObserver(fix).observe(el, { childList: true, characterData: true, subtree: true });
      fix();
    }

    function syncShellPickers() {
      ['company', 'position', 'country'].forEach(function (k) {
        if (shellPickers[k]) shellPickers[k].setValue(state.filters[k]);
      });
    }

    // --- Popup de filtros ------------------------------------------------------
    function openFilterModal(key) {
      draft = {};
      visibleFilters().forEach(function (f) {
        const v = state.filters[f.key];
        draft[f.key] = Array.isArray(v) ? v.slice()
          : (v && typeof v === 'object' ? Object.assign({}, v, v.roles ? { roles: v.roles.slice() } : {}) : v);
      });
      activeCategory = typeof key === 'string' ? key : (activeCategory || visibleFilters()[0].key);
      Object.keys(pickQuery).forEach(function (k) { delete pickQuery[k]; });
      pickFocus = null;
      document.getElementById('filterModal').classList.add('open');
      renderModal();
      document.getElementById('modalPanel').scrollTop = 0;
      showActiveCriterion();
      document.querySelector('.op-modal-box').focus();
    }

    // El criterio activo a la vista en el listado de criterios (columna en escritorio,
    // tira horizontal en teléfono), por ejemplo al abrir el popup desde un chip.
    function showActiveCriterion() {
      const rail = document.getElementById('modalRail');
      const on = rail.querySelector('.op-rail-item.is-active');
      if (!on) return;
      const rr = rail.getBoundingClientRect(), ir = on.getBoundingClientRect();
      if (ir.top < rr.top) rail.scrollTop -= rr.top - ir.top + 8;
      else if (ir.bottom > rr.bottom) rail.scrollTop += ir.bottom - rr.bottom + 8;
      if (ir.left < rr.left) rail.scrollLeft -= rr.left - ir.left + 8;
      else if (ir.right > rr.right) rail.scrollLeft += ir.right - rr.right + 8;
    }

    function closeFilterModal() {
      document.getElementById('filterModal').classList.remove('open');
    }

    function draftCount(f) {
      const v = draft[f.key];
      if (isNeutral(f, v)) return 0;
      // Ciudades guarda las desmarcadas: su número no es lo que el usuario eligió.
      if (f.type === 'cities') return 1;
      if (Array.isArray(v)) return v.length;
      if (f.type === 'dm') return 1 + (v.roles || []).length;
      return 1;
    }

    function renderModal() {
      const list = visibleFilters();
      if (!list.some(function (f) { return f.key === activeCategory; })) activeCategory = list[0].key;
      renderRail();
      renderPanel(list.find(function (f) { return f.key === activeCategory; }));
      renderModalChips();
    }

    // El rail se repinta solo, sin el panel, cuando la lista de ciudades cambia: repintar
    // el panel le quitaría el foco al buscador de ciudades.
    function renderRail() {
      const list = visibleFilters();

      // Rail agrupado
      let rail = '', group = null;
      list.forEach(function (f) {
        if (f.group !== group) { group = f.group; rail += '<div class="op-rail-group">' + esc(group) + '</div>'; }
        const n = draftCount(f);
        rail += '<button type="button" class="op-rail-item' + (f.key === activeCategory ? ' is-active' : '') + '" data-cat="' + f.key + '">' +
          esc(f.label) + (n ? '<span class="op-rail-badge">' + n + '</span>' : '') + '</button>';
      });
      document.getElementById('modalRail').innerHTML = rail;
      document.querySelectorAll('[data-cat]').forEach(function (b) {
        // Otro criterio arranca arriba de su panel, no en el desplazamiento del anterior.
        b.onclick = function () {
          const changed = activeCategory !== b.dataset.cat;
          activeCategory = b.dataset.cat;
          renderModal();
          if (changed) { document.getElementById('modalPanel').scrollTop = 0; showActiveCriterion(); }
          // El listado se re-pinta: el foco sigue en el criterio elegido
          const again = document.querySelector('[data-cat="' + activeCategory + '"]');
          if (again) again.focus({ preventScroll: true });
        };
      });
    }

    // Lo que se escribió en el buscador de cada criterio de tipo `search`, para que
    // re-pintar el popup al agregar o quitar a alguien no borre la consulta.
    const pickQuery = {};
    // Criterio cuyo buscador debe recuperar el cursor después de re-pintar el popup.
    let pickFocus = null;

    const ICON_X = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>';

    function renderPanel(f) {
      const panel = document.getElementById('modalPanel');
      if (!f) { panel.innerHTML = ''; return; }
      const v = draft[f.key];
      const opts = filterOptions(f);

      let body = '';
      if (f.type === 'cities') {
        body = '<div id="panelCities"></div>';
      } else if (f.type === 'text') {
        body = '<input type="text" class="op-states-search" id="panelText" placeholder="' + esc(f.placeholder || '') +
          '" value="' + esc(v || '') + '" style="max-width:420px;">';
      } else if (f.type === 'dm') {
        const val = v || defaultFor(f);
        body = '<div class="op-options one-col">' + f.modes.map(function (m) {
          return '<label class="op-option' + (val.mode === m.value ? ' is-checked' : '') + '">' +
            '<input type="radio" name="dm-mode" value="' + m.value + '"' + (val.mode === m.value ? ' checked' : '') + '>' +
            '<span>' + esc(m.label) + '</span>' +
            (m.note ? '<span class="op-option-note">' + esc(m.note) + '</span>' : '') +
            '</label>';
        }).join('') + '</div>';

        // Los roles solo tienen sentido cuando se pidieron empresas con decisores.
        if (val.mode === 'with') {
          body += '<div class="op-subrow">' +
              '<span class="op-subhead">Roles on record</span>' +
              '<span class="op-panel-actions">' +
                (val.roles.length === opts.length ? '' : '<button type="button" class="op-panel-clear" id="dmAll">Select all</button>') +
                (val.roles.length ? '<button type="button" class="op-panel-clear" id="dmNone">Clear</button>' : '') +
              '</span>' +
            '</div>' +
            '<div class="op-options">' + opts.map(function (o) {
              const on = val.roles.indexOf(o.value) !== -1;
              return '<label class="op-option' + (on ? ' is-checked' : '') + '">' +
                '<input type="checkbox" class="dm-role" value="' + esc(o.value) + '"' + (on ? ' checked' : '') + '>' +
                '<span>' + esc(o.label) + '</span></label>';
            }).join('') + '</div>' +
            '<div class="op-hint">With no role checked, any decision maker counts.</div>';
        }
      } else if (f.type === 'search') {
        // Se busca y se agrega: sin listado permanente, que no escala a un equipo grande.
        body = '<div class="op-pickbox">' +
            '<input type="text" class="op-states-search" id="panelSearch" autocomplete="off" placeholder="' +
              esc(f.placeholder || 'Search') + '" value="' + esc(pickQuery[f.key] || '') + '">' +
            '<div class="op-picksuggest" id="panelResults"></div>' +
          '</div>' +
          '<div class="op-subhead">Selected</div>' +
          '<div class="op-picked" id="panelPicked"></div>';
      } else if (f.type === 'daterange') {
        const preset = (v && typeof v === 'object') ? null : (v || 'all');
        body = '<div class="op-options">' + opts.map(function (o) {
          return '<label class="op-option' + (preset === o.value ? ' is-checked' : '') + '">' +
            '<input type="radio" name="preset" value="' + o.value + '"' + (preset === o.value ? ' checked' : '') + '>' +
            '<span>' + esc(o.label) + '</span></label>';
        }).join('') + '</div>' +
        '<div class="op-subhead">Custom range</div>' +
        '<div class="op-daterange">' +
          '<div><label for="dateFrom">From</label><input type="date" id="dateFrom" value="' + esc((v && v.from) || '') + '"></div>' +
          '<div><label for="dateTo">To</label><input type="date" id="dateTo" value="' + esc((v && v.to) || '') + '"></div>' +
        '</div>' +
        '<div class="op-hint">A custom range replaces the preset above. Leave “To” empty to reach today.</div>';
      } else {
        const isMulti = f.type === 'multi';
        body = '<div class="op-options' + (f.cols === 1 ? ' one-col' : '') + '">' + opts.map(function (o) {
          const checked = isMulti ? (v || []).indexOf(o.value) !== -1 : v === o.value;
          return '<label class="op-option' + (checked ? ' is-checked' : '') + '">' +
            '<input type="' + (isMulti ? 'checkbox' : 'radio') + '" name="opt-' + f.key + '" value="' + esc(o.value) + '"' + (checked ? ' checked' : '') + '>' +
            '<span>' + esc(o.label) + '</span>' +
            (o.note ? '<span class="op-option-note">' + esc(o.note) + '</span>' : '') +
            '</label>';
        }).join('') + '</div>';
      }

      const canSelectAll = f.type === 'multi' && opts.length > 2 && (!v || v.length < opts.length) && f.key !== 'country';
      panel.innerHTML =
        '<div class="op-panel-head">' +
          '<div class="op-panel-heading">' +
            '<h3 class="op-panel-title">' + esc(f.label) + '</h3>' +
            (f.hint ? '<p class="op-panel-hint">' + esc(f.hint) + '</p>' : '') +
          '</div>' +
          '<div class="op-panel-actions">' +
            (canSelectAll ? '<button type="button" class="op-panel-clear" id="panelAll">Select all</button>' : '') +
            (draftCount(f) ? '<button type="button" class="op-panel-clear" id="panelClear">Clear</button>' : '') +
          '</div>' +
        '</div>' + body;

      // Ciudades: la lista guarda las marcadas y el criterio las desmarcadas (ver cabecera).
      if (f.type === 'cities') {
        const countries = countriesIn(draft);
        const all = GEO_CITIES.filter(function (c) { return countries.indexOf(c.country) !== -1; }).map(function (c) { return c.id; });
        renderCityChecklist(document.getElementById('panelCities'), {
          idPrefix: 'opCities',
          countries: countries,
          selected: all.filter(function (id) { return (v || []).indexOf(id) === -1; }),
          onChange: function (checkedIds) {
            draft.cities = all.filter(function (id) { return checkedIds.indexOf(id) === -1; });
            renderRail();
            renderModalChips();
          }
        });
      }

      const clear = document.getElementById('panelClear');
      if (clear) clear.onclick = function () { draft[f.key] = neutralFor(f); if (f.key === 'country') pruneCities(draft); renderModal(); };

      const all = document.getElementById('panelAll');
      if (all) all.onclick = function () { draft[f.key] = opts.map(function (o) { return o.value; }); renderModal(); };

      const dmAll = document.getElementById('dmAll');
      if (dmAll) dmAll.onclick = function () {
        draft[f.key] = { mode: 'with', roles: opts.map(function (o) { return o.value; }) };
        renderModal();
      };
      const dmNone = document.getElementById('dmNone');
      if (dmNone) dmNone.onclick = function () { draft[f.key] = { mode: 'with', roles: [] }; renderModal(); };

      // La lista de ciudades cablea sus propias casillas.
      if (f.type !== 'cities') panel.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(function (input) {
        input.onchange = function () {
          if (f.type === 'multi') {
            draft[f.key] = Array.prototype.slice.call(panel.querySelectorAll('input:checked')).map(function (i) { return i.value; });
            if (f.key === 'country') pruneCities(draft);
          } else if (f.type === 'dm') {
            const cur = draft[f.key] || defaultFor(f);
            if (input.className.indexOf('dm-role') !== -1) {
              cur.roles = Array.prototype.slice.call(panel.querySelectorAll('.dm-role:checked')).map(function (i) { return i.value; });
            } else {
              cur.mode = input.value;
              // Salir de "with" descarta los roles: fuera de ahí no significan nada.
              if (cur.mode !== 'with') cur.roles = [];
            }
            draft[f.key] = cur;
          } else {
            draft[f.key] = input.value;
          }
          renderModal();
        };
      });

      const text = document.getElementById('panelText');
      if (text) text.oninput = function () { draft[f.key] = text.value; renderModalChips(); };

      if (f.type === 'search') wirePicker(f, opts);

      const from = document.getElementById('dateFrom'), to = document.getElementById('dateTo');
      if (from && to) {
        const syncRange = function () {
          to.min = from.value || '';
          from.max = to.value || '';
          draft[f.key] = (from.value || to.value) ? { from: from.value, to: to.value } : 'all';
          renderModal();
        };
        from.onchange = syncRange;
        to.onchange = syncRange;
      }
    }

    // Buscador de personas: se escribe, aparecen las coincidencias, y elegir una la suma
    // abajo. Sin listado permanente — la lista puede crecer y no tiene por qué caber.
    function wirePicker(f, opts) {
      const input = document.getElementById('panelSearch');
      const results = document.getElementById('panelResults');
      const pickedBox = document.getElementById('panelPicked');
      const picked = draft[f.key] || [];
      const query = (pickQuery[f.key] || '').trim().toLowerCase();

      // Sin consulta no hay sugerencias; lo ya elegido tampoco se vuelve a ofrecer.
      if (!query) {
        results.innerHTML = '';
        results.classList.remove('open');
      } else {
        const list = opts.filter(function (o) {
          if (picked.indexOf(o.value) !== -1) return false;
          return o.label.toLowerCase().indexOf(query) !== -1 ||
            String(o.note || '').toLowerCase().indexOf(query) !== -1;
        });
        results.innerHTML = list.length
          ? list.map(function (o) {
              return '<button type="button" class="op-pickitem" data-pick="' + esc(o.value) + '">' +
                '<span class="op-pickitem-label">' + esc(o.label) + '</span>' +
                (o.note ? '<span class="op-option-note">' + esc(o.note) + '</span>' : '') +
                '</button>';
            }).join('')
          : '<div class="op-hint" style="padding:var(--space-3);">Nobody else matches &ldquo;' + esc(pickQuery[f.key]) + '&rdquo;.</div>';
        results.classList.add('open');
        // Flota sobre el panel (floatList, rbac.js): el desplazamiento del panel no la recorta.
        floatList(input, results, { close: function () { results.classList.remove('open'); } });
      }

      pickedBox.innerHTML = picked.length
        ? picked.map(function (val) {
            const o = opts.find(function (x) { return x.value === val; }) || { label: val };
            return '<span class="op-pickchip">' + esc(o.label) +
              '<button class="op-chip-x" data-unpick="' + esc(val) + '" aria-label="Remove ' + esc(o.label) + '">' + ICON_X + '</button></span>';
          }).join('')
        : '<span class="op-hint">Nothing selected. Every ' + esc(f.label) + ' is included.</span>';

      // Elegir a alguien limpia la consulta: cierra las sugerencias y deja listo el campo
      // para el nombre siguiente.
      results.querySelectorAll('[data-pick]').forEach(function (b) {
        b.onclick = function () {
          draft[f.key] = f.single ? [b.dataset.pick] : (draft[f.key] || []).concat([b.dataset.pick]);
          pickQuery[f.key] = '';
          pickFocus = f.key;
          renderModal();
        };
      });
      pickedBox.querySelectorAll('[data-unpick]').forEach(function (b) {
        b.onclick = function () {
          draft[f.key] = (draft[f.key] || []).filter(function (x) { return x !== b.dataset.unpick; });
          pickFocus = f.key;
          renderModal();
        };
      });

      input.oninput = function () { pickQuery[f.key] = input.value; pickFocus = f.key; renderModal(); };

      if (pickFocus === f.key) {
        pickFocus = null;
        input.focus();
        if (input.setSelectionRange) input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function renderModalChips() {
      const chips = visibleFilters().filter(function (f) { return draftCount(f); }).map(function (f) {
        return '<span class="op-foot-chip">' + esc(f.chip(draft[f.key], draft)) +
          '<button class="op-chip-x" data-dchip="' + f.key + '" aria-label="Remove">' + ICON_X + '</button></span>';
      });
      document.getElementById('modalChips').innerHTML = chips.join('');
      document.querySelectorAll('[data-dchip]').forEach(function (b) {
        b.onclick = function () {
          const f = FILTERS.find(function (x) { return x.key === b.dataset.dchip; });
          draft[f.key] = neutralFor(f);
          if (f.key === 'country') pruneCities(draft);
          renderModal();
        };
      });
    }

    // --- Arranque --------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', function () {
      if (!initSession()) return;
      renderHeaderControls();
      renderSidebar('vacancies');
      resetFilters(state.filters);

      const input = document.getElementById('searchInput');

      mountShellPickers();

      document.getElementById('searchBtn').onclick = commitSearch;
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') commitSearch(); });

      document.getElementById('sortSelect').onchange = function (e) {
        state.sort = e.target.value;
        state.page = 1;
        render();
      };

      document.getElementById('modalClose').onclick = closeFilterModal;
      document.getElementById('modalClearAll').onclick = function () { clearFilters(draft); renderModal(); };
      document.getElementById('modalApply').onclick = function () {
        Object.keys(draft).forEach(function (k) { state.filters[k] = draft[k]; });
        state.page = 1;
        closeFilterModal();
        syncShellPickers();
        render();
      };
      document.getElementById('filterModal').onclick = function (e) {
        if (e.target.id === 'filterModal') closeFilterModal();
      };
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeFilterModal();
      });

      render();
    });
  </script>
</body>
</html>
