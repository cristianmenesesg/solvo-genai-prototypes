<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Solvo Sales Platform</title>
  <link rel="stylesheet" href="tokens.css?v=20261125a" />
  <link rel="stylesheet" href="theme.css?v=20261125a" />
  <link rel="stylesheet" href="styles.css?v=20261125a">
  <script src="theme.js?v=20261125a"></script>
  <style>
    /* ------------------------------------------------------------------------
       Login de Solvo Platform: una tarjeta centrada sobre el azul de Solvo, con
       el borde superior naranja, el logo, el nombre y la descripción de la
       plataforma y el acceso con Microsoft (Entra ID).
       ------------------------------------------------------------------------ */
    body { margin: 0; background: #006F8B; }
    .lg {
      min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      padding: 32px 16px;
      background: linear-gradient(160deg, #0089AB 0%, #00728F 50%, #00566B 100%);
    }
    [data-theme='dark'] body { background: #00222C; }
    [data-theme='dark'] .lg { background: linear-gradient(160deg, #004A5C 0%, #00313D 55%, #00222C 100%); }

    .lg-card {
      width: 100%; max-width: 400px; box-sizing: border-box;
      padding: 40px 36px 32px; text-align: center;
      background: var(--bg-surface); border-radius: 16px; border-top: 4px solid #ED7422;
      box-shadow: 0 24px 60px rgba(0, 40, 52, .35);
    }
    .lg-logo { display: block; height: 40px; width: auto; margin: 0 auto 28px; }
    [data-theme='dark'] .lg-logo { filter: brightness(1.4); }
    .lg-card h1 { margin: 0 0 8px; font-family: var(--font-heading); font-size: 24px; line-height: 1.2; font-weight: 600; color: var(--text-strong); }
    .lg-desc { margin: 0 auto 28px; max-width: 30ch; font-size: 14px; line-height: 1.55; color: var(--text-secondary); }

    .lg-error {
      display: none; margin: 0 0 16px; padding: 10px 12px; border-radius: 8px; text-align: left;
      background: var(--status-error-bg); color: var(--status-error-fg); font-size: 13px; line-height: 1.45;
    }
    .lg-error.show { display: block; }
    .lg-sso {
      width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 12px;
      border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg-surface);
      font: 600 15px var(--font-body); color: var(--text-strong); cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .lg-sso:hover { border-color: var(--color-secondary); box-shadow: 0 6px 18px color-mix(in srgb, var(--color-secondary) 22%, transparent); }
    .lg-sso:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .lg-sso[disabled] { cursor: progress; opacity: .75; }
    .lg-sso .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-default); border-top-color: var(--color-secondary); animation: lgspin .8s linear infinite; display: none; }
    .lg-sso[disabled] .spin { display: inline-block; }
    .lg-sso[disabled] .ms { display: none; }
    @keyframes lgspin { to { transform: rotate(360deg); } }
    .lg-hint { margin: 14px 0 0; font-size: 13px; color: var(--text-muted); }
    .lg-foot { margin: 0; font-size: 12px; color: rgba(255, 255, 255, .72); }

    @media (max-width: 480px) {
      .lg-card { padding: 32px 24px 28px; }
      .lg-logo { height: 34px; margin-bottom: 24px; }
      .lg-card h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main class="lg">
    <div class="lg-card">
      <img class="lg-logo" src="SolvoGlobal_Logo_Color.png" alt="Solvo Global">
      <h1>Solvo Sales Platform</h1>
      <p class="lg-desc">The hub for detecting open positions, companies and contacts across Solvo Global's market.</p>
      <div class="lg-error" id="loginError" role="alert">Your account does not have access to Solvo Sales Platform. Ask an administrator to add you.</div>
      <button type="button" class="lg-sso" id="ssoBtn">
        <svg class="ms" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 21 21" aria-hidden="true">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
        </svg>
        <span class="spin" aria-hidden="true"></span>
        <span id="ssoLabel">Sign in with Microsoft</span>
      </button>
      <p class="lg-hint">Use your @solvo.global account.</p>
    </div>
    <p class="lg-foot">© Solvo Global</p>
  </main>

  <script>
    /* Prototipo: el botón simula el inicio de sesión con Microsoft y lleva a la
       página de acceso demo, donde se elige el rol. En el producto, el rol lo da la
       cuenta (grupo de seguridad de Entra ID) y la página de acceso demo no existe. */
    const btn = document.getElementById('ssoBtn');
    btn.addEventListener('click', function () {
      btn.disabled = true;
      document.getElementById('ssoLabel').textContent = 'Signing in…';
      setTimeout(function () { window.location.href = 'demo-access.html'; }, 700);
    });
    // ?error=unauthorized muestra el estado de cuenta sin acceso.
    if (new URLSearchParams(location.search).get('error') === 'unauthorized') document.getElementById('loginError').classList.add('show');
  </script>
</body>
</html>
